name: Baseball optional AI editorial candidates
on:
  workflow_dispatch:
    inputs:
      analysis:
        description: Structured weekly selection or retained Japan Series prose trial
        type: choice
        options: [weekly, japan_series]
        default: weekly
      season:
        description: Saved MLB season 2014–2025 (weekly only)
        type: string
        default: "2025"
      week:
        description: Monday of the saved week (weekly only)
        type: string
        default: "2025-09-22"
      competition:
        description: Keep Regular and Postseason separate
        type: choice
        options: [regular, postseason]
        default: regular
      generate:
        description: Generate one unpublished candidate only after owner free-plan and terms setup
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npb-optional-ai-editorial
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Validate evidence and optional provider boundaries
        run: npx vitest run tests/npb-ai-insights.test.ts tests/npb-ai-staging.test.ts tests/npb-ai-workflow.test.ts tests/weekly-analysis.test.ts tests/weekly-ai.test.ts
      - uses: actions/cache/restore@v4
        id: state
        with:
          path: .data/npb-ai-insights
          key: npb-ai-candidates-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: npb-ai-candidates-v1-
      - name: Prepare input without invoking AI
        id: prepare
        env:
          AI_ANALYSIS: ${{ inputs.analysis }}
          WEEKLY_SEASON: ${{ inputs.season }}
          WEEKLY_WEEK: ${{ inputs.week }}
          WEEKLY_COMPETITION: ${{ inputs.competition }}
        run: |
          if [ "$AI_ANALYSIS" = "weekly" ]; then
            npx tsx scripts/prepare-weekly-ai.ts
          else
            npx tsx scripts/prepare-npb-ai-insights.ts --stage
          fi
      - name: Optional single free-plan attempt, never publication
        if: inputs.generate == true
        env:
          AI_ANALYSIS: ${{ inputs.analysis }}
          WEEKLY_SEASON: ${{ inputs.season }}
          WEEKLY_WEEK: ${{ inputs.week }}
          WEEKLY_COMPETITION: ${{ inputs.competition }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          NPB_AI_FREE_PLAN_REVIEWED: ${{ vars.NPB_AI_FREE_PLAN_REVIEWED }}
          NPB_AI_TERMS_REVIEWED: ${{ vars.NPB_AI_TERMS_REVIEWED }}
        run: |
          if [ "$AI_ANALYSIS" = "weekly" ]; then
            npx tsx scripts/prepare-weekly-ai.ts --generate
          else
            npx tsx scripts/prepare-npb-ai-insights.ts --generate
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.state.outcome == 'success'
        with:
          path: .data/npb-ai-insights
          key: npb-ai-candidates-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload unpublished review package
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: npb-ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/npb-ai-insights/review.json
          retention-days: 7
          if-no-files-found: error
      - name: Record safe summary
        run: echo 'Candidate preparation only. No canonical/public writes, Gate changes, source article bodies or automatic publication. No scheduled AI execution is enabled.' >> "$GITHUB_STEP_SUMMARY"
