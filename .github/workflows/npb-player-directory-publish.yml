name: Publish NPB Player Directory
on:
  push:
    branches: [main]
    paths:
      - src/data/npb-player-events-release.json
      - src/data/npb-player-events-retained-releases.json
  workflow_dispatch:
    inputs:
      preserve_published_only:
        description: Publish app and independent Historical additions, preserving current NPB generation without DB or source access
        type: boolean
        default: false
      profile_projection_only:
        description: Preserve published IDs/date/affiliation; update licensed profile projections without canonical DB access
        type: boolean
        default: false
      import_verified_profiles:
        description: Import only the four reviewed Wikidata identities before publication
        type: boolean
        default: false
      stage_only:
        description: Rehearse a preserve-only release and retain evidence without deploying
        type: boolean
        default: false
      team_generation_repair_run:
        description: Approved stage-only backup run ID for an exact Catalog and Team Season repair; requires preserve-only
        type: string
        default: ""
permissions:
  contents: read
  actions: read
env:
  PRESERVE_ONLY: ${{ github.event_name == 'push' || inputs.preserve_published_only == true }}
concurrency:
  group: daily-npb-collector-and-pages
  cancel-in-progress: false
jobs:
  stage:
    if: >-
      github.event.repository.private == false &&
      (github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.stage_only && inputs.preserve_published_only))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      generated_at: ${{ steps.identity.outputs.generated_at }}
      projection_hashes: ${{ steps.publication.outputs.projection_hashes }}
      app_index_sha256: ${{ steps.publication.outputs.app_index_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Refuse incompatible preserve-only inputs
        if: inputs.stage_only || (github.event_name == 'workflow_dispatch' && inputs.team_generation_repair_run != '')
        env:
          PROFILE_ONLY: ${{ inputs.profile_projection_only }}
          IMPORT_PROFILES: ${{ inputs.import_verified_profiles }}
        run: test "$PRESERVE_ONLY" = true && test "$PROFILE_ONLY" != true && test "$IMPORT_PROFILES" != true
      - name: Require the active player-event version to be publicly readable before switching the app
        if: github.event_name == 'push'
        run: npx tsx scripts/verify-published-npb-player-events.ts --active-only
      - name: Import reviewed Player Master v2 profiles
        if: github.event_name == 'workflow_dispatch' && inputs.import_verified_profiles == true && inputs.profile_projection_only != true && inputs.preserve_published_only != true && inputs.stage_only != true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/import-npb-player-master-v2.ts --apply --confirmed-mapping
      - name: Generate validated Player Directory from read-only queries
        if: github.event_name == 'workflow_dispatch' && inputs.profile_projection_only != true && inputs.preserve_published_only != true && inputs.stage_only != true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/generate-npb-player-directory.ts --require-remote --payload-root=.data/publish
      - name: Stage current standings without source access
        if: github.event_name == 'workflow_dispatch' && inputs.profile_projection_only != true && inputs.preserve_published_only != true && inputs.stage_only != true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run publish:npb:remote -- --payload-root .data/publish
      - name: Stage published Directory and standings without canonical DB access
        if: env.PRESERVE_ONLY == 'true' || inputs.profile_projection_only == true
        run: |
          if [ "$PRESERVE_ONLY" = 'true' ]; then
            npx tsx scripts/stage-npb-profile-only-directory.ts .data/publish --preserve-only
          else
            npx tsx scripts/stage-npb-profile-only-directory.ts .data/publish
          fi
      - name: Validate Player Directory and record identity
        id: identity
        shell: bash
        run: |
          node -e "const p=require('./.data/publish/data/npb/players/latest.json'); if(p.schemaVersion!==2 || p.teams.length!==12 || !p.players.length) process.exit(1); console.log(p.players.length+' players')"
          echo "generated_at=$(node -p "require('./.data/publish/data/npb/players/latest.json').generatedAt")" >> "$GITHUB_OUTPUT"
      - name: Build app and stage complete Pages site
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          mkdir -p dist/data/standings/npb
          cp .data/publish/data/standings/npb/latest.json dist/data/standings/npb/latest.json
          npx tsx scripts/preserve-published-npb-hot.ts
          npx tsx scripts/preserve-published-npb-season.ts
          npx tsx scripts/preserve-published-npb-player-directory.ts
          npx tsx scripts/preserve-published-npb-game-surface.ts
          if [ "$PRESERVE_ONLY" != 'true' ]; then
            npx tsx scripts/refresh-npb-profile-projections.ts .data/publish/data/npb/players/latest.json dist
          fi
          npx tsx scripts/preserve-mlb-historical.ts dist/data/mlb
      - name: Apply the reviewed Team Season pair to the complete staged site
        if: github.event_name == 'workflow_dispatch' && inputs.team_generation_repair_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_REPAIR_RUN: ${{ inputs.team_generation_repair_run }}
        run: |
          set -euo pipefail
          test "$PRESERVE_ONLY" = true
          [[ "$TEAM_REPAIR_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          gh run view "$TEAM_REPAIR_RUN" --json workflowName,event,conclusion --jq \
            'select(.workflowName == "NPB portable backup restore drill" and .event == "workflow_dispatch" and .conclusion == "success") | .conclusion' | grep -Fx success
          gh run download "$TEAM_REPAIR_RUN" --repo "$GITHUB_REPOSITORY" -n npb-team-generation-repair --dir .data/team-generation-repair
          npx tsx scripts/npb-team-generation-repair.ts apply .data/team-generation-repair dist
      - uses: actions/configure-pages@v5
      - name: Validate coordinated NPB projections before artifact upload
        id: publication
        run: |
          npx tsx scripts/verify-npb-publication.ts dist
          echo "app_index_sha256=$(sha256sum dist/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 7
      - name: Write the rehearsal hash evidence
        if: inputs.stage_only
        env:
          PROJECTION_HASHES: ${{ steps.publication.outputs.projection_hashes }}
          APP_INDEX_SHA256: ${{ steps.publication.outputs.app_index_sha256 }}
        run: |
          mkdir -p .data/rehearsal
          printf '%s\n' "$PROJECTION_HASHES" > .data/rehearsal/npb-hashes.json
          printf '%s\n' "$APP_INDEX_SHA256" > .data/rehearsal/app-index.sha256
      - uses: actions/upload-artifact@v4
        if: inputs.stage_only
        with:
          name: npb-preserve-only-rehearsal
          path: .data/rehearsal
          retention-days: 7
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.stage_only != true
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enforce final draft first-publication deadline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/verify-npb-draft-final-window.ts
      - name: Publish complete artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify active and retained player-event versions over public HTTP
        env:
          EXPECTED_APP_INDEX_SHA256: ${{ needs.stage.outputs.app_index_sha256 }}
        run: npx tsx scripts/verify-published-npb-player-events.ts
      - name: Verify public Player Directory HTTP
        env:
          EXPECTED_GENERATED_AT: ${{ needs.stage.outputs.generated_at }}
          EXPECTED_PROJECTION_HASHES: ${{ needs.stage.outputs.projection_hashes }}
        run: npx tsx scripts/verify-published-npb-player-directory.ts
