name: Daily NPB collector and Pages delivery
on:
  schedule:
    - cron: "37 18 * * *" # 03:37 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "Check source without DB writes, or ingest and publish"
        type: choice
        options: [dry-run, ingest, publish]
        default: dry-run
        required: true
      target_date:
        description: "Optional completed JST date (YYYY-MM-DD); default yesterday"
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-npb-collector-and-pages
  cancel-in-progress: false
jobs:
  collect:
    # Schedule stays opt-in until manual remote ingestion, replay and Pages delivery pass.
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.NPB_COLLECTOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.safety.outputs.skip }}
      date: ${{ steps.safety.outputs.target_date }}
      generated_at: ${{ steps.publication.outputs.generated_at }}
      projection_hashes: ${{ steps.publication.outputs.projection_hashes }}
    steps:
      - name: Capture runner start
        run: echo "NPB_RUNNER_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Observe scheduled clock without treating manual runs as proof
        run: npx tsx scripts/log-npb-schedule.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPB_CRON: ${{ github.event.schedule }}
          NPB_SCHEDULE_TIMEZONE: UTC
      - name: Safety net skips EOD-published and currently valid Day
        id: safety
        if: github.event_name == 'schedule' || inputs.mode == 'ingest'
        run: |
          date_jst="${TARGET_DATE:-$(TZ=Asia/Tokyo date -d yesterday +%F)}"
          npx tsx scripts/npb-eod.ts --action=safety-check --date="$date_jst"
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Verify remote DB connection without writing
        run: npm run verify:npb:remote -- --connection-only
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Source dry run (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          NPB_NF3_ENABLED: ${{ vars.NPB_NF3_ENABLED }}
        run: |
          args=()
          if [[ -n "$TARGET_DATE" ]]; then args+=(--date "$TARGET_DATE"); fi
          npm run collector:npb -- --fetch --dry-run "${args[@]}"
      - name: Ingest, verify, and stage validated payload
        if: steps.safety.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest')
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NPB_NF3_ENABLED: ${{ vars.NPB_NF3_ENABLED }}
        run: |
          args=()
          if [[ -n "$TARGET_DATE" ]]; then args+=(--date "$TARGET_DATE"); fi
          npm run collector:npb -- --fetch --require-remote --payload-root .data/publish "${args[@]}"
          npm run -s verify:npb:remote -- --payload-root .data/publish "${args[@]}" > .data/remote-before.json
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            npm run collector:npb -- --offline-raw --require-remote --payload-root .data/publish "${args[@]}"
            npm run -s verify:npb:remote -- --payload-root .data/publish "${args[@]}" > .data/remote-after.json
            cmp .data/remote-before.json .data/remote-after.json
          fi
          cat .data/remote-before.json
      - name: Collect all final Games for the preceding JST day
        if: steps.safety.outputs.skip != 'true' && vars.NPB_DAY_FACTS_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest')
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NPB_NF3_ENABLED: ${{ vars.NPB_NF3_ENABLED }}
        run: |
          args=()
          if [[ -n "$TARGET_DATE" ]]; then args+=(--date="$TARGET_DATE"); fi
          trigger=manual
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then trigger=scheduled; fi
          npm run collector:npb:day -- --fetch --require-remote --trigger="$trigger" --backup-root=.data/day-backup "${args[@]}"
          npm run verify:npb:day -- --require-remote --require-complete "${args[@]}"
      - name: Encrypt and upload short-retention Fact backup
        if: steps.safety.outputs.skip != 'true' && vars.NPB_DAY_FACTS_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest')
        shell: bash
        env:
          NPB_BACKUP_ENCRYPTION_KEY: ${{ secrets.NPB_BACKUP_ENCRYPTION_KEY }}
        run: |
          if [[ -d .data/day-backup/export ]]; then
            tar -C .data/day-backup -czf .data/npb-backup.tar.gz export
            npx tsx scripts/crypt-npb-backup.ts encrypt .data/npb-backup.tar.gz .data/npb-backup.tar.gz.enc
            rm .data/npb-backup.tar.gz
          fi
      - name: Store encrypted Fact backup for seven days
        if: steps.safety.outputs.skip != 'true' && vars.NPB_DAY_FACTS_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest')
        uses: actions/upload-artifact@v4
        with:
          name: npb-facts-encrypted-${{ github.run_id }}
          path: .data/npb-backup.tar.gz.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Republish from verified remote data without source access
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          args=()
          if [[ -n "$TARGET_DATE" ]]; then args+=(--date "$TARGET_DATE"); fi
          npm run publish:npb:remote -- --payload-root .data/publish "${args[@]}"
      - name: Build Web app with the same-origin validated JSON
        if: steps.safety.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest' || inputs.mode == 'publish')
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          NPB_MODE: ${{ inputs.mode }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$NPB_MODE" == "ingest" ]]; then
            date_jst="${TARGET_DATE:-$(TZ=Asia/Tokyo date -d yesterday +%F)}"
            npx tsx scripts/generate-npb-season.ts --date="$date_jst" --payload-root=.data/publish
            npx tsx scripts/generate-npb-hot-payload.ts --require-remote
            npx tsx scripts/generate-npb-player-directory.ts --require-remote --payload-root=.data/publish
          fi
          npm run build
          mkdir -p dist/data/standings/npb
          cp .data/publish/data/standings/npb/latest.json dist/data/standings/npb/latest.json
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$NPB_MODE" == "ingest" ]]; then
            cp -R .data/publish/data dist/
            mkdir -p dist/data/npb/hot
            cp .data/hot-diagnostics/npb-hot-7d.json dist/data/npb/hot/latest.json
          else
            npx tsx scripts/preserve-published-npb-hot.ts
            npx tsx scripts/preserve-published-npb-player-directory.ts
            npx tsx scripts/preserve-published-npb-season.ts
          fi
          npx tsx scripts/generate-npb-game-surface.ts --payload-root=dist > .data/game-surface.json
      - name: Configure GitHub Pages
        if: steps.safety.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest' || inputs.mode == 'publish')
        uses: actions/configure-pages@v5
      - name: Preserve released MLB historical data
        if: steps.safety.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest' || inputs.mode == 'publish')
        run: npx tsx scripts/preserve-mlb-historical.ts dist/data/mlb
      - name: Validate coordinated NPB projections before artifact upload
        id: publication
        if: steps.safety.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest' || inputs.mode == 'publish')
        run: npx tsx scripts/verify-npb-publication.ts dist
      - name: Upload complete site as one Pages artifact
        if: steps.safety.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest' || inputs.mode == 'publish')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: needs.collect.outputs.skip != 'true' && github.event.repository.private == false && (github.event_name == 'schedule' || inputs.mode == 'ingest' || inputs.mode == 'publish')
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish complete artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify coordinated public projection family
        env:
          EXPECTED_GENERATED_AT: ${{ needs.collect.outputs.generated_at }}
          EXPECTED_PROJECTION_HASHES: ${{ needs.collect.outputs.projection_hashes }}
        run: npx tsx scripts/verify-published-npb-player-directory.ts
      - name: Record successful safety-net publication after public readback
        if: vars.NPB_DAY_FACTS_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest')
        run: npx tsx scripts/npb-eod.ts --action=mark-published --date="$TARGET_DATE"
        env:
          TARGET_DATE: ${{ needs.collect.outputs.date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Optional published EOD favorite notifications
        if: vars.NPB_DAY_FACTS_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'ingest')
        continue-on-error: true
        timeout-minutes: 5
        run: npx tsx scripts/send-eod-notifications.ts
        env:
          TARGET_DATE: ${{ needs.collect.outputs.date }}
          NPB_NOTIFICATIONS_ENABLED: ${{ vars.NPB_NOTIFICATIONS_ENABLED }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
