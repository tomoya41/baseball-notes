name: NPB published data freshness
on:
  schedule:
    - cron: "17 3 * * *" # 12:17 JST; the deadline is independently configurable
  workflow_dispatch:
    inputs:
      integrity_audit:
        description: Read-only saved Game/Day integrity audit (no source acquisition or repairs)
        type: boolean
        default: false
      shortened_readiness:
        description: Explicit bounded nf3 dry-run of the six shortened Games on a private restored scratch DB (no canonical writes)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.shortened_readiness && 20 || 5 }}
    concurrency:
      group: ${{ inputs.shortened_readiness && 'daily-npb-collector-and-pages' || format('npb-freshness-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Capture runner start
        run: echo "NPB_RUNNER_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Observe scheduled clock
        run: npx tsx scripts/log-npb-schedule.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPB_CRON: ${{ github.event.schedule }}
          NPB_SCHEDULE_TIMEZONE: UTC
      - name: Check published JSON and Turso ingestion metadata
        run: npm run monitor:npb:freshness -- --require-healthy
        env:
          NPB_FRESHNESS_DEADLINE_HOUR_JST: ${{ vars.NPB_FRESHNESS_DEADLINE_HOUR_JST || '12' }}
          NPB_FRESHNESS_PAYLOAD_URL: https://tomoya41.github.io/baseball-notes/data/standings/npb/latest.json
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Audit saved NPB integrity
        if: always() && github.event_name == 'workflow_dispatch' && inputs.integrity_audit
        run: |
          mkdir -p .data/integrity-release
          npx tsx scripts/audit-npb-data-integrity.ts > .data/integrity-release/npb-integrity.json
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.integrity_audit
        with:
          name: npb-integrity-read-only
          path: .data/integrity-release/npb-integrity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Read-only shortened readiness on independently restored private scratch DB
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shortened_readiness
        run: npx tsx scripts/audit-npb-shortened-readiness.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shortened_readiness
        with:
          name: npb-shortened-readiness-diagnostic
          path: .data/shortened-readiness/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
