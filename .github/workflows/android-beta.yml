name: Android beta build and release quality
on:
  push:
    branches: [main, "codex/**"]
    paths: ["android/**", "src/**", "scripts/prepare-android-web.ts", "scripts/scan-release-assets.ts", "scripts/verify-android-apk.ts", "scripts/lib/android-apk-verification.ts", "package*.json", "capacitor.config.ts", ".github/workflows/android-beta.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      emulator:
        description: Run Android 36 emulator smoke and performance tests
        type: boolean
        default: true
      page_size:
        description: Standard API 36 regression or API 36 with actual 16 KB pages
        type: choice
        options: [standard, 16kb]
        default: standard
permissions:
  contents: read
concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx tsx scripts/prepare-android-web.ts && npx cap sync android
      - run: npx tsx scripts/scan-release-assets.ts .data/android-web
      - name: Debug APK and unsigned release AAB
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest --no-daemon
      - name: Verify debug APK identity and cryptographic signatures
        run: npx tsx scripts/verify-android-apk.ts --apk=android/app/build/outputs/apk/debug/app-debug.apk --sdk-build-tools="$ANDROID_HOME/build-tools/36.0.0" --report=.data/android-apk-verification.json
      - name: Check 16 KB ZIP alignment without modifying APKs
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Scan packaged assets and record sizes
        run: |
          mkdir -p .data/apk-inspection
          unzip -q android/app/build/outputs/apk/debug/app-debug.apk 'assets/*' -d .data/apk-inspection
          npx tsx scripts/scan-release-assets.ts .data/apk-inspection
          find android/app/build/outputs -name '*.apk' -o -name '*.aab' | xargs stat --format='%n %s bytes'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E '\.so$' || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-beta-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
      - name: Retain APK verification separately without changing install artifact paths
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-verification
          path: .data/android-apk-verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  emulator:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_ANDROID_PAGE_SIZE: ${{ inputs.page_size == '16kb' && '16384' || '' }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: android-beta-unsigned, path: artifacts }
      - name: Validate connectivity diagnostic parser
        run: bash scripts/test-android-connectivity-parser.sh
      - name: Enable KVM on free Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          target: ${{ inputs.page_size == '16kb' && 'google_apis_ps16k' || 'google_apis' }}
          # The 16KB image killed the target before JNI/test startup at the
          # profile's 2560MB default (ApplicationExitInfo LOW_MEMORY/status 9).
          # Bound this disposable guest to 4GB; standard API36 stays unchanged.
          ram-size: ${{ inputs.page_size == '16kb' && '4096M' || '' }}
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: .data/android-emulator
          retention-days: 7
